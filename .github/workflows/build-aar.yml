name: Build 16KB libv2ray.aar

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'AndroidLibXrayLite tag/branch to compile'
        required: true
        default: 'v25.3.6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Clone AndroidLibXrayLite
        run: |
          git clone --branch ${{ github.event.inputs.tag }} https://github.com/2dust/AndroidLibXrayLite.git ../lib_source

      - name: Build AAR with 16KB alignment
        run: |
          cd ../lib_source
          go mod tidy -v
          export CGO_LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          gomobile bind -v -androidapi 21 -target=android -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
          cp libv2ray.aar $GITHUB_WORKSPACE/android/libs/libv2ray.aar

      - name: Upload compiled AAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-16kb-aar
          path: android/libs/libv2ray.aar
